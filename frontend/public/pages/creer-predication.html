<!-- ============================================================================
     pages/creer-predication.html — Formulaire de création / édition
     ============================================================================ -->
<div class="page-editeur">
    <a href="#/tableau-de-bord" class="lien-retour" data-testid="bouton-retour-tableau">
        {{ICONE_RETOUR}} Retour au tableau de bord
    </a>

    <h1 class="titre-principal" style="margin-top:16px;" id="titre-page">Nouvelle prédication</h1>
    <p class="sous-titre">
        Renseignez l'essentiel puis laissez l'IA structurer le message — vous garderez la plume.
    </p>

    <!-- Section 1 : Brief -->
    <section class="carte section-formulaire">
        <h2 class="section-titre">1. Votre brief</h2>
        <div class="groupe-champs-deux">
            <div>
                <label class="etiquette" for="f-titre">Titre *</label>
                <input id="f-titre" type="text" class="champ"
                       placeholder="Ex : La grâce qui relève"
                       data-testid="champ-titre" />
            </div>
            <div>
                <label class="etiquette" for="f-theme">Thème</label>
                <input id="f-theme" type="text" class="champ"
                       placeholder="Ex : Espérance, Grâce, Famille…"
                       data-testid="champ-theme" />
            </div>
            <div>
                <label class="etiquette" for="f-verset">Verset biblique principal</label>
                <input id="f-verset" type="text" class="champ"
                       placeholder="Ex : Romains 8:28"
                       data-testid="champ-verset" />
            </div>
            <div>
                <label class="etiquette" for="f-objectif">Objectif pastoral</label>
                <input id="f-objectif" type="text" class="champ"
                       placeholder="Ce que l'auditoire doit retenir / faire"
                       data-testid="champ-objectif" />
            </div>
        </div>
        <div style="margin-top:16px;">
            <label class="etiquette" for="f-notes">Notes, idées, anecdotes</label>
            <textarea id="f-notes" class="champ" rows="4"
                      placeholder="Tout ce qui traverse votre esprit…"
                      data-testid="champ-notes"></textarea>
        </div>

        <div class="barre-actions-ia">
            <button type="button" class="btn btn-ambre" id="bouton-generer"
                    data-testid="bouton-generer-predication">
                {{ICONE_ETINCELLE}} Générer la prédication
            </button>
            <button type="button" class="btn btn-secondaire" id="bouton-versets"
                    data-testid="bouton-suggerer-versets">
                {{ICONE_SIGNET}} Suggérer des versets
            </button>
        </div>

        <!-- Zone dynamique pour les versets suggérés -->
        <div id="zone-versets"></div>
    </section>

    <!-- Section 2 : Corps de la prédication -->
    <section class="carte section-formulaire">
        <h2 class="section-titre">2. Corps de la prédication</h2>

        <!-- Bloc : Introduction -->
        <div style="margin-top:20px;">
            <label class="etiquette" for="f-introduction">Introduction</label>
            <textarea id="f-introduction" class="champ" rows="5"
                      data-testid="introduction-textarea"></textarea>
            <div class="actions-assistant" data-role="assistants" data-champ="introduction"></div>
        </div>

        <!-- Liste des points principaux -->
        <div style="margin-top:24px;display:flex;justify-content:space-between;align-items:center;">
            <h3 style="font-family:Fraunces,serif;font-size:16px;font-weight:600;">Points principaux</h3>
            <button type="button" class="btn btn-secondaire btn-petit" id="bouton-ajouter-point"
                    data-testid="bouton-ajouter-point">
                {{ICONE_PLUS_PETIT}} Ajouter un point
            </button>
        </div>
        <div id="zone-points" style="margin-top:12px;"></div>

        <!-- Bloc : Conclusion -->
        <div style="margin-top:20px;">
            <label class="etiquette" for="f-conclusion">Conclusion</label>
            <textarea id="f-conclusion" class="champ" rows="4"
                      data-testid="conclusion-textarea"></textarea>
            <div class="actions-assistant" data-role="assistants" data-champ="conclusion"></div>
        </div>
    </section>

    <!-- Barre d'actions de sauvegarde -->
    <div class="barre-actions-sauvegarde">
        <button type="button" class="btn btn-primaire" id="bouton-sauvegarder"
                data-testid="bouton-sauvegarder">
            {{ICONE_ENREGISTRER}} Enregistrer
        </button>
        <!-- Bouton secondaire : varie selon mode création / édition -->
        <span id="zone-bouton-secondaire"></span>
    </div>
</div>
